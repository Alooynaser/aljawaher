<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الدروس | روضة الجواهر</title>
  <link rel="icon" href="../images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="portal">

  <header class="site-header portal-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img src="../images/logo.jpg" alt="شعار روضة الجواهر" width="44" height="44">
        <span data-ar="روضة الجواهر" data-en="Aljawaher KG">روضة الجواهر</span>
      </a>
      <div class="portal-nav">
        <a href="teacher.html" class="active" data-ar="الدروس" data-en="Lessons">الدروس</a>
        <a href="admin.html" data-roles="admin" hidden data-ar="الإدارة" data-en="Admin">الإدارة</a>
        <a href="parent.html" data-ar="أطفالي" data-en="My children">أطفالي</a>
        <button class="link-btn" id="logoutBtn" type="button" data-ar="خروج" data-en="Log out">خروج</button>
        <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language">EN</button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-title">
        <div>
          <h1><span data-ar="أهلاً" data-en="Welcome">أهلاً</span> <span id="whoami"></span> 👋</h1>
          <p class="muted" data-ar="اختر الفصل، وأضف دروس وأسئلة، وتابع حلول الطلاب." data-en="Pick a class, add lessons and questions, and follow your students’ work.">اختر الفصل، وأضف دروس وأسئلة، وتابع حلول الطلاب.</p>
        </div>
      </div>

      <section class="panel">
        <div class="panel-head">
          <label class="field" style="min-width:220px">
            <span data-ar="الفصل" data-en="Class">الفصل</span>
            <select id="classSelect"></select>
          </label>
          <button class="btn btn-primary" id="newLessonBtn" type="button" data-ar="+ درس جديد" data-en="+ New lesson">+ درس جديد</button>
        </div>
        <div class="list" id="lessonList"></div>
      </section>
    </div>
  </main>

  <!-- محرر الدرس -->
  <dialog id="editor">
    <form method="dialog" id="editorForm">
      <div class="dialog-body form">
        <h2 id="editorTitle"></h2>
        <label class="field"><span data-ar="عنوان الدرس *" data-en="Lesson title *">عنوان الدرس *</span>
          <input type="text" name="title" required maxlength="150">
        </label>
        <label class="field"><span data-ar="الشرح (اختياري)" data-en="Explanation (optional)">الشرح (اختياري)</span>
          <textarea name="body" maxlength="5000"></textarea>
        </label>
        <div class="form-row">
          <label class="field"><span data-ar="رابط فيديو (اختياري)" data-en="Video link (optional)">رابط فيديو (اختياري)</span>
            <input type="url" name="video_url" placeholder="https://youtube.com/..." dir="ltr">
          </label>
          <label class="field"><span data-ar="آخر موعد (اختياري)" data-en="Due date (optional)">آخر موعد (اختياري)</span>
            <input type="date" name="due_date">
          </label>
        </div>
        <div class="form-row" style="align-items:center">
          <label class="check"><input type="checkbox" name="has_quiz"> <span data-ar="فيه أسئلة على الشاشة" data-en="Has on-screen questions">فيه أسئلة على الشاشة</span></label>
          <label class="check"><input type="checkbox" name="allow_photo"> <span data-ar="ولي الأمر يرفع صورة الحل" data-en="Parent uploads a photo of the work">ولي الأمر يرفع صورة الحل</span></label>
        </div>

        <div id="questionsBox" class="form"></div>
        <button class="btn btn-ghost" id="addQuestionBtn" type="button" data-ar="+ سؤال" data-en="+ Question">+ سؤال</button>

        <label class="check" style="margin-top:.5rem"><input type="checkbox" name="published"> <span data-ar="منشور (يظهر لأولياء الأمور)" data-en="Published (visible to parents)">منشور (يظهر لأولياء الأمور)</span></label>
      </div>
      <div class="dialog-foot">
        <button class="btn btn-ghost" value="cancel" formnovalidate data-ar="إلغاء" data-en="Cancel">إلغاء</button>
        <button class="btn btn-primary" id="saveLessonBtn" type="button" data-ar="حفظ" data-en="Save">حفظ</button>
      </div>
    </form>
  </dialog>

  <!-- التسليمات -->
  <dialog id="subsDialog">
    <div class="dialog-body">
      <h2 id="subsTitle" style="margin-bottom:1rem"></h2>
      <div class="table-wrap" id="subsTable"></div>
    </div>
    <div class="dialog-foot">
      <button class="btn btn-ghost" type="button" onclick="this.closest('dialog').close()" data-ar="إغلاق" data-en="Close">إغلاق</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="../script.js"></script>
  <script src="portal.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
